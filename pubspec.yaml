name: vibe_cast
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: 9.1.0
  go_router: 14.8.1
  get_it: 8.0.3
  injectable: ^2.6.0
  dio: 5.8.0+1
  flutter_secure_storage: 9.2.4
  flutter_screenutil: 5.9.3
  easy_localization: 3.0.7+1
  flutter_svg: 2.0.17
  equatable: 2.0.7
  record: ^6.2.1
  socket_io_client: ^3.1.6
  permission_handler: ^12.0.3
  google_fonts: ^8.2.0
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^22.1.0
  flutter_sound: ^9.30.0
  logger: ^2.7.0
  audio_session: ^0.2.4
  wakelock_plus: ^1.5.2
  audioplayers: ^6.7.1
  path_provider: ^2.1.6
  encrypt: ^5.0.3
  avatar_glow: ^3.0.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  injectable_generator: 2.9.0
  flutter_launcher_icons: ^0.14.4
  # flutter_native_splash: ^2.4.7 # Removed to use standard Flutter splash

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/

flutter_native_splash:
  color: "#E0E5EC"
  color_dark: "#1A1A1A"
  android_12:
    color: "#E0E5EC"
    color_dark: "#1A1A1A"
